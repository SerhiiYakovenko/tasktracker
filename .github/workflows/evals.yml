name: Evals

on:
  push:
    branches: [main]
    paths: ["evals/**", ".github/workflows/evals.yml"]
  pull_request:
    paths: ["evals/**", ".github/workflows/evals.yml"]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  review-evals:
    # Pull requests from forks get no secrets, so skip them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    container: pragent/pr-agent:0.49.0-github_action   # a real version pin
    steps:
      - uses: actions/checkout@v4
      - name: Test the graders
        run: python -m unittest discover -s evals
      - name: Run the review evals
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python evals/run_evals.py evals/review_cases.yaml
      - name: Keep the raw reviews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviews
          path: evals-output/
